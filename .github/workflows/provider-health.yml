name: Provider health

# Daily read-only audit of the official Frankfurter deployment.
# Reports stale providers and unknown currency codes in the run logs without managing GitHub issues.
# See bin/provider_health.rb.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
      - run: ruby bin/provider_health.rb
        env:
          API: https://api.frankfurter.dev/v2/providers
          DRY_RUN: "1"
