name: Provider health

# Daily read-only audit of the official Frankfurter deployment.
# Reports stale providers in the run logs without managing GitHub issues.
# See bin/provider_health.rb.

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
      - run: ruby bin/provider_health.rb
        env:
          API: https://api.frankfurter.dev/v2/providers
          DRY_RUN: "1"
